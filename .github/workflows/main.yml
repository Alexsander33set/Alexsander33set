name: Generate Snake

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: generate-snake
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
      - uses: Platane/snk/svg-only@d8f6715049803e982ee5ff501b6b9b7d5deeb09b # v3.5.0
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark
      - name: Check calendar is not empty
        run: |
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          for filename in ['dist/github-contribution-grid-snake.svg', 'dist/github-contribution-grid-snake-dark.svg']:
              root = ET.parse(filename).getroot()
              cells = [node for node in root.iter() if 'c' in node.get('class', '').split()]
              assert len(cells) >= 365, f'{filename}: incomplete calendar ({len(cells)} days)'
          PY
      - uses: crazy-max/ghaction-github-pages@df5cc2bfa78282ded844b354faee141f06b41865 # v4.2.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
